<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <script>
        (function() {
            const stored = localStorage.getItem('darkMode');
            const theme = stored === 'dark' || stored === 'light'
                ? stored
                : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.dataset.bsTheme = theme;
            if (theme === 'dark') document.documentElement.classList.add('dark-mode');
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Pruebas</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/fonts/material-icons.min.css">
    <link rel="stylesheet" href="assets/css/bss-overrides.css">
    <link rel="stylesheet" href="assets/css/Fading%20animation.css">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
    <section class="mt-3">
        <h1 class="ms-3">Usted!</h1>
        <div id="mi-terapeuta" class="ms-4 mt-2 mb-2 text-muted">Cargando información de tu terapeuta...</div>
        <p class="ms-4 mt-0 pt-0 mb-0">¡Eche un vistazo a su progreso!:</p>
        <div class="border border-secondary ms-4 me-4 mt-4 mb-0 pb-0 border-top opacity-25"></div>
        <div class="card mb-3">
            <div class="card-body">
                <h4 class="card-title">Encuesta de Salud</h4>
                <button class="btn btn-primary" type="button">Empezar</button>
            </div>
        </div>
        <div class="border border-secondary ms-4 me-4 mt-4 mb-0 pb-0 border-top opacity-25"></div>
        <div class="card mb-3"></div>
    </section>
    <nav class="navbar navbar-expand-md fixed-bottom bg-white ms-md-0 ps-md-0 mb-0 border-top">
        <div class="container-fluid">
            <div class="text-center d-flex w-100 justify-content-around ms-0 ps-0 me-0 mb-0 pb-0" id="dashboard-nav-root"></div>
        </div>
    </nav>
    <script src="assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/js/click%20button%20delay.js"></script>
    <script src="assets/js/dark-mode.js"></script>
    <script src="assets/js/notifications.js"></script>
    <script>
    function escapeHtml(str){
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    async function cargarTerapeuta(){
        const el = document.getElementById('mi-terapeuta');
        try{
            const res = await fetch('/mi_terapeuta', { credentials: 'include' });
            if(!res.ok){ el.textContent = 'No hay terapeuta asignado'; return; }
            const data = await res.json();
            const nombre = data.nombre || '';
            const apellidos = data.apellidos || '';
            const especialidad = data.especialidad ? ` — ${data.especialidad}` : '';
            const baseName = `${nombre} ${apellidos}`.trim() || (data.correo || 'Fisioterapeuta');
            el.innerHTML = `Tu terapeuta: <span style="color:#ffce2e;font-weight:700;">[TERAPEUTA]</span> ${escapeHtml(baseName)}${escapeHtml(especialidad)}`.trim();
        }catch(e){
            el.textContent = 'Error cargando terapeuta';
        }
    }
    cargarTerapeuta();

    // Keep push subscription alive from this patient screen as well.
    window.addEventListener('DOMContentLoaded', async () => {
        try {
            if (typeof Notification !== 'undefined' && Notification.permission === 'granted' && typeof pushRegister === 'function') {
                await pushRegister();
            }
        } catch (e) {
            console.error('Push sync failed on paciente me:', e);
        }
    });
    </script>
</body>

</html>
