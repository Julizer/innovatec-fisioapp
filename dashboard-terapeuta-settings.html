<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Pruebas</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/fonts/material-icons.min.css">
    <link rel="stylesheet" href="assets/css/bss-overrides.css">
    <link rel="stylesheet" href="assets/css/Fading%20animation.css">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
    <section class="mt-3">
        <div class="d-flex justify-content-between align-items-center ms-3 me-3">
            <h1>Configuración</h1>
            <button id="logout-btn" class="btn btn-outline-danger" onclick="logout()">Cerrar sesión</button>
        </div>

        <div class="card mb-3 ms-3 me-3 mt-3">
            <div class="card-body">
                <h4 class="card-title">Cuenta</h4>
                <p id="mi-correo" class="mb-1 text-muted"></p>
            </div>
        </div>

        <div id="codigo-card" class="card mb-3 ms-3 me-3" style="display:none;">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="card-title mb-0">Tu código de terapeuta</h5>
                    <small id="codigo-terapeuta" class="text-muted"></small>
                </div>
                <div class="text-center">
                    <img id="codigo-qr" src="" alt="QR" style="width:120px;height:120px;display:block;margin-bottom:8px;" />
                    <div>
                        <button class="btn btn-sm btn-outline-secondary" onclick="copyCodigo()">Copiar</button>
                    </div>
                </div>
            </div>
        </div>

    </section>
    <nav class="navbar navbar-expand-md fixed-bottom bg-white border-top">
        <div class="container-fluid">
            <div class="text-center d-flex w-100 justify-content-around"><a class="small text-decoration-none text-center d-flex w-100 flex-column justify-content-center align-items-center text-muted active" href="dashboard-terapeuta-home.html"><svg class="bi bi-house fs-4 d-block mb-1" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 16 16" style="font-size: 24px;">
                        <path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293zM13 7.207V13.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V7.207l5-5z"></path>
                    </svg><strong>Home</strong></a><a class="small text-decoration-none text-center d-flex w-100 flex-column justify-content-center align-items-center text-muted active" href="dashboard-terapeuta-patients.html"><svg class="bi bi-heart fs-4 d-block" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 16 16">
                        <path d="m8 2.748-.717-.737C5.6.281 2.514.878 1.4 3.053c-.523 1.023-.641 2.5.314 4.385.92 1.815 2.834 3.989 6.286 6.357 3.452-2.368 5.365-4.542 6.286-6.357.955-1.886.838-3.362.314-4.385C13.486.878 10.4.28 8.717 2.01zM8 15C-7.333 4.868 3.279-3.04 7.824 1.143q.09.083.176.171a3 3 0 0 1 .176-.17C12.72-3.042 23.333 4.867 8 15"></path>
                    </svg><strong>Patients</strong></a><a class="small text-decoration-none text-center d-flex w-100 flex-column justify-content-center align-items-center active" href="#"><i class="material-icons d-block ms-0 ps-0 me-0 pe-md-0 mb-0 pb-0" style="padding-bottom: 0px;">settings</i><strong>Settings</strong></a></div>
        </div>
    </nav>
    <script src="assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/js/click%20button%20delay.js"></script>
    <script>
    async function fetchMe() {
        try {
            const res = await fetch('/me', { credentials: 'include' });
            if (!res.ok) {
                window.location.href = 'index-sign_in.html';
                return;
            }
            const data = await res.json();
            document.getElementById('mi-correo').textContent = data.correo || '';
            if (data.rol === 'terapeuta') {
                document.getElementById('codigo-terapeuta').textContent = data.codigo || '';
                const qr = document.getElementById('codigo-qr');
                if (data.codigo) {
                    qr.src = `https://chart.googleapis.com/chart?cht=qr&chs=200x200&chl=${encodeURIComponent(data.codigo)}`;
                }
                document.getElementById('codigo-card').style.display = 'block';
            }
        } catch (err) {
            console.error(err);
        }
    }

    function copyCodigo() {
        const codigo = document.getElementById('codigo-terapeuta').textContent;
        if (!codigo) return;
        navigator.clipboard?.writeText(codigo).then(() => {
            alert('Código copiado');
        }).catch(() => { alert('No se pudo copiar'); });
    }

    async function logout() {
        try {
            await fetch('/logout', { method: 'POST', credentials: 'include' });
        } catch (e) { console.error(e); }
        window.location.href = 'index_NUEVO.html';
    }

    fetchMe();
    </script>
</body>

</html>
