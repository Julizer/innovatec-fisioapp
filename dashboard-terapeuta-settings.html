<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <script>
        (function() {
            const stored = localStorage.getItem('darkMode');
            const theme = stored === 'dark' || stored === 'light'
                ? stored
                : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.dataset.bsTheme = theme;
            if (theme === 'dark') document.documentElement.classList.add('dark-mode');
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Pruebas</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/fonts/material-icons.min.css">
    <link rel="stylesheet" href="assets/css/bss-overrides.css">
    <link rel="stylesheet" href="assets/css/Fading%20animation.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="assets/js/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
    <style>
        .qr-frame {
            display: inline-block;
            margin-bottom: 8px;
            padding: 6px;
            background: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 12px;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.08), 0 6px 16px rgba(0, 0, 0, 0.12);
        }

        .qr-frame canvas,
        .qr-frame img {
            display: block;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <section class="mt-3">
        <div class="d-flex justify-content-between align-items-center ms-3 me-3">
            <h1 class="mt-3 mb-0" style="font-size: 3rem; color: #0CBD97; font-weight: bold; font-family: 'Poppins', sans-serif;">Ajustes</h1>
        </div>

        <div class="card mb-3 ms-3 me-3 mt-3">
            <div class="card-body">
                <h4 class="card-title">Cuenta</h4>
                <p id="mi-correo" class="mb-1 text-muted"></p>
                <button id="logout-btn" class="btn btn-outline-danger mt-2" onclick="logout()">Cerrar sesión</button>
            </div>
        </div>

        <div class="card mb-3 ms-3 me-3">
            <div class="card-body">
                <h4 class="card-title">Apariencia</h4>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="dark-mode-toggle">
                    <label class="form-check-label" for="dark-mode-toggle">Activar modo oscuro</label>
                </div>
            </div>
        </div>

        <div id="codigo-card" class="card mb-3 ms-3 me-3" style="display:none;">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="card-title mb-0">Tu código de terapeuta</h5>
                    <small id="codigo-terapeuta" class="text-muted">Cargando...</small>
                </div>
                <div class="text-center">
                    <div id="codigo-qr" class="qr-frame">
                        <div class="text-muted" style="width:120px;height:120px;display:flex;align-items:center;justify-content:center;border:1px solid #dee2e6;">
                            <small>Sin código</small>
                        </div>
                    </div>
                    <div>
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="copyCodigo()">Copiar</button>
                        <button class="btn btn-sm btn-outline-primary" onclick="downloadQR()">Descargar QR</button>
                    </div>
                </div>
            </div>
        </div>

    </section>
    <nav class="navbar navbar-expand-md fixed-bottom bg-white border-top">
        <div class="container-fluid">
            <div class="text-center d-flex w-100 justify-content-around ms-0 ps-0 me-0 mb-0 pb-0" id="dashboard-nav-root"></div>
        </div>
    </nav>
    <script src="assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/js/click%20button%20delay.js"></script>
    <script src="assets/js/dark-mode.js"></script>
    <script src="assets/js/notifications.js"></script>
    <script>
    // Verificar que QRCode esté disponible
    window.addEventListener('load', function() {
        if (typeof QRCode === 'undefined') {
            console.warn('QRCode library not loaded, falling back to text display');
        }
    });
    async function fetchMe() {
        try {
            const res = await fetch('/me', { credentials: 'include' });
            if (!res.ok) {
                window.location.href = 'index-sign_in.html';
                return;
            }
            const data = await res.json();
            document.getElementById('mi-correo').textContent = data.correo || '';
            if (data.rol === 'terapeuta') {
                document.getElementById('codigo-terapeuta').textContent = data.codigo || 'Sin código asignado';
                const qrContainer = document.getElementById('codigo-qr');
                if (data.codigo) {
                    // Mostrar indicador de carga
                    qrContainer.innerHTML = '<div class="text-muted" style="width:120px;height:120px;display:flex;align-items:center;justify-content:center;border:1px solid #dee2e6;"><small>Generando QR...</small></div>';

                    try {
                        // Verificar que QRCode esté disponible
                        if (typeof QRCode === 'undefined') {
                            throw new Error('QRCode library not available');
                        }

                        // Pequeño delay para mostrar el indicador de carga
                        setTimeout(() => {
                            // Limpiar contenedor
                            qrContainer.innerHTML = '';
                            // Generar nuevo código QR
                            new QRCode(qrContainer, {
                                text: data.codigo,
                                width: 120,
                                height: 120,
                                colorDark: "#000000",
                                colorLight: "#ffffff",
                                correctLevel: QRCode.CorrectLevel.H
                            });
                        }, 200);
                    } catch (error) {
                        console.error('Error generando QR:', error);
                        // Fallback: mostrar código como texto formateado
                        qrContainer.innerHTML = `
                            <div style="width:120px;height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #dee2e6;background:#f8f9fa;padding:8px;text-align:center;">
                                <div style="font-size:10px;margin-bottom:4px;">Código:</div>
                                <div style="font-weight:bold;font-size:14px;word-break:break-all;">${data.codigo}</div>
                            </div>
                        `;
                    }
                } else {
                    // No hay código asignado
                    qrContainer.innerHTML = '<div class="text-muted" style="width:120px;height:120px;display:flex;align-items:center;justify-content:center;border:1px solid #dee2e6;"><small>Sin código</small></div>';
                }
                document.getElementById('codigo-card').style.display = 'block';
            }
        } catch (err) {
            console.error(err);
        }
    }

    function copyCodigo() {
        const codigo = document.getElementById('codigo-terapeuta').textContent;
        if (!codigo) return;
        navigator.clipboard?.writeText(codigo).then(() => {
            alert('Código copiado');
        }).catch(() => { alert('No se pudo copiar'); });
    }

    function downloadQR() {
        const qrContainer = document.getElementById('codigo-qr');
        const canvas = qrContainer.querySelector('canvas');

        if (canvas) {
            // Si hay canvas (QR generado), descargar como imagen
            const link = document.createElement('a');
            link.download = 'codigo-terapeuta-qr.png';
            link.href = canvas.toDataURL('image/png');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        } else {
            // Si no hay canvas (fallback), copiar el código al portapapeles
            const codigo = document.getElementById('codigo-terapeuta').textContent;
            if (codigo && codigo !== 'Cargando...') {
                navigator.clipboard?.writeText(codigo).then(() => {
                    alert('Código copiado al portapapeles (QR no disponible para descarga)');
                }).catch(() => {
                    alert('Código: ' + codigo + '\n\nCópialo manualmente');
                });
            } else {
                alert('Código no disponible');
            }
        }
    }

    async function logout() {
        try {
            await fetch('/logout', { method: 'POST', credentials: 'include' });
        } catch (e) { console.error(e); }
        window.location.href = 'index_NUEVO.html';
    }

    fetchMe();
    </script>
</body>

</html>
