<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <script>
        (function() {
            const stored = localStorage.getItem('darkMode');
            const theme = stored === 'dark' || stored === 'light'
                ? stored
                : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.dataset.bsTheme = theme;
            if (theme === 'dark') document.documentElement.classList.add('dark-mode');
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Pruebas</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/fonts/material-icons.min.css">
    <link rel="stylesheet" href="assets/css/bss-overrides.css">
    <link rel="stylesheet" href="assets/css/Fading%20animation.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
</head>

<body>
<section class="mt-3">
    <div class="d-flex justify-content-between align-items-center ms-3 me-3">
        <h1 class="mt-3 mb-0" style="font-size: 3rem; color: #0CBD97; font-weight: bold; font-family: 'Poppins', sans-serif;">Tus pacientes</h1>
    </div>
    <div class="ms-3 me-3 mt-2 mb-2 d-flex align-items-center gap-2">
        <button id="enableTherapistPushBtn" class="btn btn-sm btn-outline-primary" type="button">Activar notificaciones</button>
        <small id="therapistPushState" class="text-muted"></small>
    </div>
    <p class="ms-3 mt-2">Último paciente:</p>
    
    <!-- 🔹 PACIENTES QUE NO COMPLETARON ENCUESTA HOY -->
    <div id="pendientes-pacientes" class="mb-3"></div>

    <!-- 🔹 LISTA DINÁMICA -->
    <div id="lista-pacientes"></div>

</section>
    <nav class="navbar navbar-expand-md fixed-bottom bg-white ms-md-0 ps-md-0 mb-0 border-top">
        <div class="container-fluid">
            <div class="text-center d-flex w-100 justify-content-around ms-0 ps-0 me-0 mb-0 pb-0" id="dashboard-nav-root"></div>
        </div>
    </nav>
    <script src="assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/js/click%20button%20delay.js"></script>
    <script src="assets/js/dark-mode.js"></script>
    <script>
        window.__disableGlobalUnreadTitlePolling = true;
    </script>
    <script src="assets/js/notifications.js"></script>
    <script>
        const sexos = {
            'M': 'Masculino',
            'F': 'Femenino'
        };
        let lastUnreadTotal = 0;
        let unreadMonitorReady = false;
    </script>
    <script>
    async function enviarRecordatorio(pacienteId, nombre, mensaje) {
        try {
            const url = `/notificar/paciente/${pacienteId}`;
            console.log('Enviando recordatorio ->', {url, pacienteId, mensaje});
            const res = await fetch(url, {
                method: "POST",
                credentials: "include",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({mensaje})
            });

            let data;
            try { data = await res.json(); } catch(e){ data = {error: 'Respuesta no JSON'} }

            console.log('Respuesta notificar:', res.status, data);

            if (!res.ok) {
                const errMsg = data.error || data.mensaje || ('Error enviando recordatorio: ' + res.status);
                try { notify({title: 'Error', body: errMsg, playSound: false, browserNotification: false}); } catch(e){}
                alert(errMsg);
                return;
            }

            alert(`Notificación enviada a ${nombre}`);
            // show local confirmation toast on therapist screen but do not play patient sound or browser notification
            try { notify({title: 'Recordatorio enviado', body: `Notificación enviada a ${nombre}`, playSound: false, browserNotification: false}); } catch(e) {}
            cargarPacientes();
        } catch (error) {
            console.error("Error enviando notificación:", error);
            try { notify({title: 'Error', body: (error && error.message) || 'No se pudo enviar la notificación', playSound: false, browserNotification: false}); } catch(e){}
            alert("No se pudo enviar la notificación. Inténtalo de nuevo.");
        }
    }

    async function enviarRecordatorioNormal(pacienteId, nombre) {
        await enviarRecordatorio(pacienteId, nombre, `Hola ${nombre}, recuerda completar tu encuesta diaria.`);
    }

    async function enviarPruebaNotificacion(pacienteId, nombre) {
        await enviarRecordatorio(pacienteId, nombre, `Prueba de notificación: este mensaje confirma que tu dispositivo está suscrito.`);
    }

    async function activarNotificacionesTerapeuta() {
        const state = document.getElementById('therapistPushState');
        try {
            await notifyRequestPermission();
            if (Notification.permission !== 'granted') {
                if (state) state.textContent = 'Permiso denegado en navegador.';
                return;
            }
            await pushRegister();
            if (state) state.textContent = 'Notificaciones activadas en este dispositivo.';
            notify({
                title: 'Notificaciones activadas',
                body: 'Recibiras avisos cuando un paciente te escriba.',
                playSound: false,
                browserNotification: false
            });
        } catch (e) {
            if (state) state.textContent = (e && e.message) || 'No se pudo activar';
        }
    }

    async function obtenerNoLeidosPorPaciente() {
        try {
            const res = await fetch('/chat/unread_count', { credentials: 'include' });
            if (!res.ok) return {};
            const data = await res.json();
            return data.by_paciente || {};
        } catch (e) {
            return {};
        }
    }

    async function monitorNoLeidosYNotificar() {
        try {
            const res = await fetch('/chat/unread_count', { credentials: 'include' });
            if (!res.ok) return;
            const data = await res.json();
            const total = Number(data.total || 0);
            const byPaciente = data.by_paciente || {};
            const latestPreview = data.latest_preview || null;

            if (typeof window.notifySetUnreadTitle === 'function') {
                window.notifySetUnreadTitle(total);
            }

            if (unreadMonitorReady && total > lastUnreadTotal) {
                const firstPacienteId = Object.keys(byPaciente).find(k => Number(byPaciente[k] || 0) > 0);
                const targetPacienteId = latestPreview && latestPreview.paciente_id ? latestPreview.paciente_id : firstPacienteId;
                const clickUrl = targetPacienteId ? `chat.html?paciente_id=${encodeURIComponent(targetPacienteId)}` : null;
                const senderName = latestPreview && latestPreview.sender_name ? latestPreview.sender_name : 'Paciente';
                const previewText = latestPreview && latestPreview.preview ? latestPreview.preview : `Tienes ${total} mensaje(s) sin leer.`;
                if (document.visibilityState !== 'visible' && typeof window.notifyFlashNewMessageTitle === 'function') {
                    window.notifyFlashNewMessageTitle(total);
                }
                notify({
                    title: `Nuevo mensaje de ${senderName}`,
                    body: previewText,
                    playSound: true,
                    browserNotification: true,
                    clickUrl
                });
            }

            lastUnreadTotal = total;
            unreadMonitorReady = true;
        } catch (e) {
            // no-op: monitoring should not break page flow
        }
    }

    function abrirChatPaciente(pacienteId) {
        window.location.href = `chat.html?paciente_id=${encodeURIComponent(pacienteId)}`;
    }

    async function cargarPacientes() {
        const contenedor = document.getElementById("lista-pacientes");
        const pendientesCont = document.getElementById("pendientes-pacientes");

        try {
            const [resPacientes, resPendientes] = await Promise.all([
                fetch("/pacientes", {credentials: "include"}),
                fetch("/pacientes/pendientes", {credentials: "include"})
            ]);

            if (resPacientes.status === 401 || resPendientes.status === 401) {
                window.location.href = "index-sign_in.html";
                return;
            }

            if (resPacientes.status === 403 || resPendientes.status === 403) {
                alert("No tienes permisos");
                return;
            }

            const pacientes = await resPacientes.json();
            const pendientes = await resPendientes.json();
            const noLeidosMap = await obtenerNoLeidosPorPaciente();
            const pendientesIds = new Set(pendientes.map(p => p.id));

            pendientesCont.innerHTML = "";
            if (pendientes.length === 0) {
                pendientesCont.innerHTML = `
                    <div class="card mb-3 border-success">
                        <div class="card-body">
                            <h4 class="card-title">Pacientes al día</h4>
                            <p class="mb-0">Todos tus pacientes completaron la encuesta diaria de hoy.</p>
                        </div>
                    </div>
                `;
            } else {
                pendientesCont.innerHTML = `
                    <div class="card mb-3 border-warning">
                        <div class="card-body">
                            <h4 class="card-title">Pacientes sin encuesta hoy</h4>
                            <p class="text-muted mb-3">Estos pacientes aún no han completado la evaluación diaria de hoy.</p>
                            ${pendientes.map(p => `
                                <div class="border rounded p-3 mb-2">
                                    <div class="d-flex justify-content-between align-items-start">
                                        <div>
                                            <strong>${p.nombre} ${p.apellidos}</strong>
                                            <div class="text-muted small">${p.correo || 'Sin correo'}</div>
                                        </div>
                                        <div class="btn-group" role="group">
                                            <button class="btn btn-sm btn-primary" onclick="abrirChatPaciente(${p.id})">
                                                Abrir chat ${Number(noLeidosMap[p.id] || 0) > 0 ? `<span class="badge bg-danger">${Number(noLeidosMap[p.id])}</span>` : ''}
                                            </button>
                                            <button class="btn btn-sm btn-outline-primary" onclick="enviarRecordatorioNormal(${p.id}, '${p.nombre.replace(/'/g, "\\'")}')">
                                                Enviar recordatorio
                                            </button>
                                            <button class="btn btn-sm btn-outline-success" onclick="enviarPruebaNotificacion(${p.id}, '${p.nombre.replace(/'/g, "\\'")}')">
                                                Probar notificación
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            contenedor.innerHTML = "";
            pacientes.forEach(p => {
                const badge = pendientesIds.has(p.id)
                    ? `<span class="badge bg-warning text-dark ms-2">Pendiente</span>`
                    : `<span class="badge bg-success ms-2">Completado</span>`;

                contenedor.innerHTML += `
                    <div class="card mb-3">
                        <div class="card-body">
                            <h4 class="card-title">${p.nombre} ${p.apellidos} ${badge}</h4>
                            <h6 class="text-muted">${p.correo || "Sin correo"}</h6>
                            <p class="mb-0">Tel: ${p.telefono || "N/A"}</p>
                            <p class="mb-0">Fecha de nacimiento: ${p.fecha_nacimiento || "N/A"}</p>
                            <p class="mb-0">Sexo: ${sexos[p.sexo] || "N/A"}</p>
                            <div class="mt-2">
                                <button class="btn btn-sm btn-primary" onclick="abrirChatPaciente(${p.id})">Abrir chat ${Number(noLeidosMap[p.id] || 0) > 0 ? `<span class="badge bg-danger">${Number(noLeidosMap[p.id])}</span>` : ''}</button>
                            </div>
                        </div>
                    </div>
                `;
            });

        } catch (error) {
            console.error("Error cargando pacientes:", error);
            pendientesCont.innerHTML = "";
            contenedor.innerHTML = "<p>Error cargando pacientes</p>";
        }
    }

    // Ejecutar automáticamente
async function verificarSesion() {
    try {
        const res = await fetch("/me", {
            credentials: "include"
        });

        if (!res.ok) {
            window.location.href = "index-sign_in.html";
            return false;
        }

        const data = await res.json();

        console.log("ROL:", data.rol);

        if (!["terapeuta", "admin"].includes(data.rol)) {
            alert("No tienes permisos");
            return false;
        }

        return true;

    } catch (error) {
        console.error("Error verificando sesión:", error);
        return false;
    }
}

// 🔥 EJECUCIÓN CONTROLADA
(async () => {
    const ok = await verificarSesion();
    if (ok) {
        const btn = document.getElementById('enableTherapistPushBtn');
        if (btn) btn.addEventListener('click', activarNotificacionesTerapeuta);
        if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
            pushRegister().catch(() => {});
        }
        cargarPacientes(); // 👈 SOLO aquí se ejecuta
        setInterval(cargarPacientes, 7000);
            monitorNoLeidosYNotificar();
            setInterval(monitorNoLeidosYNotificar, 4000);
    }
})();
    </script>
</body>

</html>
