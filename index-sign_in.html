<!DOCTYPE html>
<html data-bs-theme="light" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Fisioterapp</title>

    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/Fading%20animation.css">
    <link rel="stylesheet" href="assets/css/styles.min.css">
    <style>
        :root {
            --bs-primary: #0CBD97;
        }
        .btn-primary {
            background-color: #0CBD97;
            border-color: #0CBD97;
        }
        .btn-primary:hover {
            background-color: #0CBD97;
            border-color: #0CBD97;
        }
        .btn-outline-primary {
            color: #0CBD97;
            border-color: #0CBD97;
        }
        .btn-outline-primary:hover {
            background-color: #0CBD97;
            border-color: #0CBD97;
        }
        a {
            color: #0CBD97;
        }
        a:hover {
            color: #0CBD97;
        }
    </style>
</head>

<body>

<section class="text-center screen" id="role-select">

    <h4 class="mt-3 mb-0">FisioterAPP</h4>

    <div class="container" style="font-size: 19px; max-width:400px;">

        <!-- FORM -->
        <form onsubmit="event.preventDefault(); iniciarSesion();">

            <p class="mt-4 pt-0 mb-0 text-center">
                Correo electrónico:
            </p>

            <input id="correo" type="email" class="form-control mb-3" required>

            <p class="mt-4 pt-0 mb-0 pb-0">
                Tu contraseña
            </p>

            <input id="password" type="password" class="form-control mb-3" required>

            <button class="btn btn-primary w-100" type="submit">
                Iniciar sesión
            </button>

        </form>

    </div>

</section>

<script src="assets/bootstrap/js/bootstrap.min.js"></script>

<script>
// Redirección automática si hay sesión activa
async function checkActiveSession() {
    try {
        const res = await fetch("/me", {
            method: "GET",
            credentials: "include"
        });
        
        if (res.ok) {
            const userData = await res.json();
            const rol = userData.rol;
            
            // Si hay sesión activa, redirigir al dashboard correspondiente
            if (rol === "paciente") {
                window.location.href = "dashboard-paciente-home.html";
            } else if (rol === "terapeuta") {
                window.location.href = "dashboard-terapeuta-home.html";
            } else if (rol === "admin") {
                window.location.href = "dashboard-admin.html";
            }
        }
    } catch (error) {
        console.log("No hay sesión activa");
    }
}

// Verificar sesión al cargar la página
document.addEventListener("DOMContentLoaded", checkActiveSession);

async function iniciarSesion() {

    const correo = document.getElementById("correo").value;
    const password = document.getElementById("password").value;

    try {
        const res = await fetch("/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            credentials: "include", // 🔥 ESTO FALTABA
            body: JSON.stringify({ correo, password })
        });

        const data = await res.json();

        if (res.ok) {
            alert("Login correcto");
            const rol = data.usuario?.rol;

            if (rol === "paciente") {
                window.location.href = "dashboard-paciente-home.html";
            } else {
                window.location.href = "dashboard-terapeuta-home.html";
            }
        } else {
            alert(data.mensaje);
        }

    } catch (error) {
        console.error(error);
        alert("Error conectando con el servidor");
    }
}
</script>

</body>
</html>
