<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">

    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/Fading%20animation.css">
    <link rel="stylesheet" href="assets/css/styles.min.css">
</head>

<body>

<section class="text-center screen" id="role-select">

    <h4 class="mt-3 mb-0">FisioterAPP</h4>

    <div class="container" style="font-size: 19px; max-width:400px;">

        <p class="mt-4 mb-4 text-center">
            ¡Bienvenido! ¿Vienes a sanar o a ayudar a sanar?
        </p>

        <div class="d-grid gap-3 mb-4">
            <a href="index-sign_up_terapeuta.html" class="btn btn-primary btn-lg">
                <i class="material-icons" style="vertical-align: middle; margin-right: 8px;"></i>
                Soy Terapeuta
            </a>
            <a href="index-sign_up_paciente.html" class="btn btn-outline-primary btn-lg">
                <i class="material-icons" style="vertical-align: middle; margin-right: 8px;"></i>
                Soy Paciente
            </a>
        </div>

        <div class="text-center">
            <a href="index-sign_in.html" class="text-decoration-none">¿Ya tienes cuenta? Inicia sesión</a>
        </div>

    </div>

</section>

<script src="assets/bootstrap/js/bootstrap.min.js"></script>

<script>
// Redirección automática si hay sesión activa
async function checkActiveSession() {
    try {
        const res = await fetch("/me", {
            method: "GET",
            credentials: "include"
        });
        
        if (res.ok) {
            const userData = await res.json();
            const rol = userData.rol;
            
            // Si hay sesión activa, redirigir al dashboard correspondiente
            if (rol === "paciente") {
                window.location.href = "dashboard-paciente-home.html";
            } else if (rol === "terapeuta") {
                window.location.href = "dashboard-terapeuta-home.html";
            } else if (rol === "admin") {
                window.location.href = "dashboard-admin.html";
            }
        }
    } catch (error) {
        console.log("No hay sesión activa");
    }
}

// Verificar sesión al cargar la página
document.addEventListener("DOMContentLoaded", checkActiveSession);
</script>
