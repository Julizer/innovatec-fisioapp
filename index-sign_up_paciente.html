<!DOCTYPE html>
<html data-bs-theme="light" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Registro de Paciente - Fisioterapp</title>

    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/Fading%20animation.css">
    <link rel="stylesheet" href="assets/css/styles.min.css">
    <style>
        :root {
            --bs-primary: #0CBD97;
            --bs-primary-rgb: 12, 189, 151;
        }
        .btn-primary {
            --bs-btn-color: #fff;
            --bs-btn-bg: #0CBD97;
            --bs-btn-border-color: #0CBD97;
            --bs-btn-hover-color: #fff;
            --bs-btn-hover-bg: #0CBD97;
            --bs-btn-hover-border-color: #0CBD97;
            --bs-btn-active-color: #fff;
            --bs-btn-active-bg: #0CBD97;
            --bs-btn-active-border-color: #0CBD97;
            --bs-btn-disabled-color: #fff;
            --bs-btn-disabled-bg: #0CBD97;
            --bs-btn-disabled-border-color: #0CBD97;
            background-color: #0CBD97;
            border-color: #0CBD97;
            --bs-btn-focus-shadow-rgb: 12, 189, 151;
        }
        .btn-primary:hover {
            background-color: #0CBD97;
            border-color: #0CBD97;
        }
        .btn-outline-primary {
            --bs-btn-color: #0CBD97;
            --bs-btn-border-color: #0CBD97;
            --bs-btn-hover-color: #fff;
            --bs-btn-hover-bg: #0CBD97;
            --bs-btn-hover-border-color: #0CBD97;
            --bs-btn-active-color: #fff;
            --bs-btn-active-bg: #0CBD97;
            --bs-btn-active-border-color: #0CBD97;
            --bs-btn-disabled-color: #0CBD97;
            --bs-btn-disabled-bg: transparent;
            --bs-btn-disabled-border-color: #0CBD97;
            color: #0CBD97;
            border-color: #0CBD97;
            --bs-btn-focus-shadow-rgb: 12, 189, 151;
        }
        .btn-outline-primary:hover {
            background-color: #0CBD97;
            border-color: #0CBD97;
        }
        .btn:focus,
        .btn:focus-visible {
            box-shadow: 0 0 0 0.25rem rgba(12, 189, 151, 0.25);
        }
        .form-control:focus,
        .form-select:focus {
            border-color: #0CBD97;
            box-shadow: 0 0 0 0.25rem rgba(12, 189, 151, 0.25);
        }
        a {
            color: #0CBD97;
        }
        a:hover {
            color: #0CBD97;
        }
    </style>
</head>

<body>

<section class="text-center screen" id="paciente-signup">

    <h4 class="mt-3 mb-0">Registro de Paciente</h4>

    <div class="container" style="font-size: 19px; max-width:400px;">

        <!-- FORM -->
        <form onsubmit="event.preventDefault(); registrarPaciente();">

            <div class="mb-3 mt-4">
                <label for="codigo_terapeuta" class="form-label">Código de tu terapeuta</label>
                <div class="input-group">
                    <input id="codigo_terapeuta" type="text" class="form-control" placeholder="Ej: ABC12345" required>
                    <button id="verificar-codigo" class="btn btn-outline-primary" type="button" onclick="verificarCodigo()">Verificar</button>
                </div>
                <div id="terapeuta-info" class="form-text mt-2"></div>
            </div>

            <p class="mt-4 mb-0 text-center">
                Información Personal
            </p>

            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input id="nombre" type="text" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="apellidos" class="form-label">Apellidos</label>
                <input id="apellidos" type="text" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="fecha_nacimiento" class="form-label">Fecha de Nacimiento</label>
                <input id="fecha_nacimiento" type="date" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="sexo" class="form-label">Sexo</label>
                <select id="sexo" class="form-select" required>
                    <option value="">Seleccionar...</option>
                    <option value="M">Masculino</option>
                    <option value="F">Femenino</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono (opcional)</label>
                <input id="telefono" type="tel" class="form-control">
            </div>

            <p class="mt-4 mb-0 text-center">
                Información de Cuenta
            </p>

            <div class="mb-3">
                <label for="correo" class="form-label">Correo electrónico</label>
                <input id="correo" type="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input id="password" type="password" class="form-control" required>
            </div>

            <div class="mb-4">
                <label for="confirmar" class="form-label">Confirmar contraseña</label>
                <input id="confirmar" type="password" class="form-control" required>
            </div>

            <button class="btn btn-primary w-100 mb-3" type="submit">
                Crear cuenta de Paciente
            </button>

            <div class="text-center">
                <a href="index-sign_up_terapeuta.html" class="text-decoration-none">¿Eres terapeuta? Regístrate aquí</a>
            </div>

        </form>

    </div>

</section>

<script src="assets/bootstrap/js/bootstrap.min.js"></script>

<script>
// Redirección automática si hay sesión activa
async function checkActiveSession() {
    try {
        const res = await fetch("/me", {
            method: "GET",
            credentials: "include"
        });
        
        if (res.ok) {
            const userData = await res.json();
            const rol = userData.rol;
            
            // Si hay sesión activa, redirigir al dashboard correspondiente
            if (rol === "paciente") {
                window.location.href = "dashboard-paciente-home.html";
            } else if (rol === "terapeuta") {
                window.location.href = "dashboard-terapeuta-home.html";
            } else if (rol === "admin") {
                window.location.href = "dashboard-admin.html";
            }
        }
    } catch (error) {
        console.log("No hay sesión activa");
    }
}

// Verificar sesión al cargar la página
document.addEventListener("DOMContentLoaded", checkActiveSession);

async function registrarPaciente() {
    const correo = document.getElementById("correo").value;
    const password = document.getElementById("password").value;
    const confirmar = document.getElementById("confirmar").value;
    const codigo_terapeuta = document.getElementById("codigo_terapeuta").value;
    const nombre = document.getElementById("nombre").value;
    const apellidos = document.getElementById("apellidos").value;
    const fecha_nacimiento = document.getElementById("fecha_nacimiento").value;
    const sexo = document.getElementById("sexo").value;
    const telefono = document.getElementById("telefono").value;

    // Validación básica
    if (password !== confirmar) {
        alert("Las contraseñas no coinciden");
        return;
    }

    if (!codigo_terapeuta.trim()) {
        alert("El código del terapeuta es obligatorio");
        return;
    }

    const res = await fetch("/register", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        credentials: "include",
        body: JSON.stringify({
            correo,
            password,
            rol: "paciente",
            codigo_terapeuta,
            nombre,
            apellidos,
            fecha_nacimiento,
            sexo,
            telefono
        })
    });

    const data = await res.json();

    if (data.success) {
        alert("Cuenta de paciente creada correctamente");
        window.location.href = "index-sign_in.html";
    } else {
        alert(data.mensaje || "Error al registrar paciente");
    }
}

async function verificarCodigo() {
    const codigo = document.getElementById('codigo_terapeuta').value.trim();
    const info = document.getElementById('terapeuta-info');
    info.textContent = '';
    if (!codigo) {
        info.textContent = 'Introduce un código';
        return;
    }

    try {
        const res = await fetch(`/terapeuta/lookup?codigo=${encodeURIComponent(codigo)}`);
        if (res.ok) {
            const data = await res.json();
            const nombre = data.nombre || '';
            const apellidos = data.apellidos || '';
            info.textContent = `Terapeuta encontrado: ${nombre} ${apellidos}`.trim();
            info.classList.remove('text-danger');
            info.classList.add('text-success');
        } else {
            info.textContent = 'Código no válido';
            info.classList.remove('text-success');
            info.classList.add('text-danger');
        }
    } catch (err) {
        console.error(err);
        info.textContent = 'Error verificando código';
        info.classList.add('text-danger');
    }
}
</script>

</body>
</html>
