<!DOCTYPE html>
<html data-bs-theme="light" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Fisioterapp</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/bss-overrides.css">
    <link rel="stylesheet" href="assets/css/Fading%20animation.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bs-primary: #0CBD97;
        }
        * {
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(12px, 3vw, 36px);
        }
        .auth-card {
            width: min(94vw, 560px);
            padding: clamp(1.25rem, 2.5vw, 2.5rem);
        }
        @media (max-width: 576px) {
            .auth-card {
                width: 100%;
                border-radius: 14px;
            }
        }
        .btn-primary {
            background-color: #0CBD97;
            border-color: #0CBD97;
        }
        .btn-primary:hover {
            background-color: #0a9d7f;
            border-color: #0a9d7f;
        }
        .btn-outline-primary {
            color: #0CBD97;
            border-color: #0CBD97;
        }
        .btn-outline-primary:hover {
            background-color: #0CBD97;
            border-color: #0CBD97;
        }
        a {
            color: #0CBD97;
        }
        a:hover {
            color: #0a9d7f;
        }
    </style>
</head>

<body>
    <div class="card auth-card d-flex flex-column align-items-center text-center">
            <img src="assets/art/tortuICON.svg" alt="Tortu Logo" style="width: 200px; height: 200px; margin-top: 20px;">
            <h1 class="mt-3 mb-0" style="font-size: 3.5rem; color: #0CBD97; font-weight: bold; font-family: 'Poppins', sans-serif;">Tortu</h1>
            <p class="fs-3 text-center text-muted"><span style="color: rgb(33, 37, 41);">Tu rehabilitación guíada</span></p><a class="btn btn-primary btn-lg fs-2 w-100 pt-3 mb-4 pb-3" role="button" href="index-sign_in.html"> Iniciar sesión </a><a class="btn btn-outline-primary btn-lg fs-2 w-100 mt-2 pt-3 pb-3" role="button" href="index-sign_up.html"> Crear cuenta </a>
            <p class="text-center" style="font-size: 13px;">¿Primera vez aquí? Regístrate para <br>comenzar tu terapia y guardar tu progreso!</p><a class="btn btn-outline-primary btn-lg fs-2 mt-4 pt-3 pb-3" role="button" href="index.html">Index</a>
    </div>
    <script src="assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/js/click%20button%20delay.js"></script>

    <script>
    // Redirección automática si hay sesión activa
    async function checkActiveSession() {
        try {
            const res = await fetch("/me", {
                method: "GET",
                credentials: "include"
            });
            
            if (res.ok) {
                const userData = await res.json();
                const rol = userData.rol;
                
                // Si hay sesión activa, redirigir al dashboard correspondiente
                if (rol === "paciente") {
                    window.location.href = "dashboard-paciente-home.html";
                } else if (rol === "terapeuta") {
                    window.location.href = "dashboard-terapeuta-home.html";
                } else if (rol === "admin") {
                    window.location.href = "dashboard-admin.html";
                }
            }
        } catch (error) {
            console.log("No hay sesión activa");
        }
    }

    // Verificar sesión al cargar la página
    document.addEventListener("DOMContentLoaded", checkActiveSession);
    </script>
</body>

</html>
