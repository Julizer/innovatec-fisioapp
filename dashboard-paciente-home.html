<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <script>
        (function() {
            const stored = localStorage.getItem('darkMode');
            const theme = stored === 'dark' || stored === 'light'
                ? stored
                : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.dataset.bsTheme = theme;
            if (theme === 'dark') document.documentElement.classList.add('dark-mode');
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Pruebas</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/fonts/material-icons.min.css">
    <link rel="stylesheet" href="assets/css/bss-overrides.css">
    <link rel="stylesheet" href="assets/css/Fading%20animation.css">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
    <section class="mt-3">
        <h1 class="ms-3">Hola, Paciente!</h1>
        <div class="border border-secondary ms-4 me-4 mt-3 mb-2 pb-0 border-top opacity-25"></div>
        <div class="card mb-3">
            <div class="card-body">
                <h4 class="card-title">Tu grafica de progreso:</h4><svg viewBox="0 0 100 40" style="width:100%; height:120px;">
  <defs>
    <linearGradient id="grad1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0CBD97" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#0CBD97" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <path d="M0,30 L20,25 L40,28 L60,18 L80,15 L100,10 L100,40 L0,40 Z"
        fill="url(#grad1)"/>

  <polyline fill="none"
        stroke="#0CBD97"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    points="0,30 20,25 40,28 60,18 80,15 100,10"/>
</svg>

                <p class="card-text">Excelente avance!</p><a class="card-link" href="#">Ver gráfica del mes pasado</a><a class="card-link" href="#">Mas detalles</a>
            </div>
        </div>
        <div class="border border-secondary ms-4 me-4 mt-3 mb-2 pb-0 border-top opacity-25"></div>
        <div class="card mb-3">
            <div class="card-body">
                <div class="d-flex align-items-center mb-3">
                    <div class="streak-badge d-flex align-items-center justify-content-center me-3">
                        <span class="flame">🔥</span>
                    </div>
                    <div>
                        <h4 class="card-title mb-1">Evaluación Diaria</h4>
                        <p class="mb-0 text-muted">Racha actual: <strong id="streakCount">0</strong> días</p>
                    </div>
                </div>
                <p class="card-text">Completa tu evaluación diaria para que tu fisioterapeuta pueda seguir tu progreso.</p>
                <div id="surveyNotice" class="alert alert-warning d-none" role="alert"></div>
                <div id="pushStatus" class="alert d-none py-2 mb-3" role="alert"></div>
                <button class="btn btn-outline-primary btn-sm mb-3" id="enablePushBtn" type="button">
                    Activar notificaciones
                </button>
                <div class="d-grid gap-2">
                    <button class="btn btn-success" id="surveyBtn" onclick="checkSurveyStatus()">
                        <i class="material-icons me-2" style="vertical-align: middle;">assignment</i>
                        Realizar Evaluación Diaria
                    </button>
                </div>
            </div>
        </div>
        <style>
            .streak-badge {
                width: 48px;
                height: 48px;
                border-radius: 18px;
                background: linear-gradient(135deg, #ffc107 0%, #fd7e14 100%);
                color: white;
                font-size: 1.4rem;
                box-shadow: 0 6px 14px rgba(253, 126, 20, 0.25);
                animation: pulseFlame 1.8s ease-in-out infinite;
            }
            .streak-badge .flame {
                display: inline-block;
                animation: flameBounce 0.8s ease-in-out infinite;
            }
            @keyframes pulseFlame {
                0%, 100% { transform: scale(1); }
                50% { transform: scale(1.05); }
            }
            @keyframes flameBounce {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-3px); }
            }
        </style>
        <div class="border border-secondary ms-4 me-4 mt-4 mb-3 pb-0 border-top opacity-25"></div>
        <div class="card mb-3">
            <div class="card-body">
                <h4 class="card-title">Tu fisioterapeuta:</h4>
                <h4 class="d-flex justify-content-start align-items-center card-title"><a class="d-flex mt-2 pb-2" href="#"><svg class="ms-0" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 20 20" fill="none" style="font-size: 38px;">

                            <path fill-rule="evenodd" clip-rule="evenodd" d="M18 10C18 14.4183 14.4183 18 10 18C5.58172 18 2 14.4183 2 10C2 5.58172 5.58172 2 10 2C14.4183 2 18 5.58172 18 10ZM12 7C12 8.10457 11.1046 9 10 9C8.89543 9 8 8.10457 8 7C8 5.89543 8.89543 5 10 5C11.1046 5 12 5.89543 12 7ZM9.99993 11C7.98239 11 6.24394 12.195 5.45374 13.9157C6.55403 15.192 8.18265 16 9.99998 16C11.8173 16 13.4459 15.1921 14.5462 13.9158C13.756 12.195 12.0175 11 9.99993 11Z" fill="currentColor"></path>
                        </svg></a><span id="terapeutaNombre">Fisioterapeuta</span><a class="text-decoration-none d-flex flex-column align-items-center ms-3" href="#" onclick="abrirChat(); return false;"><svg class="text-black ms-0 offset-lg-4" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" style="font-size: 24px;">
                            <path d="M8 12H8.01M12 12H12.01M16 12H16.01M21 12C21 16.4183 16.9706 20 12 20C10.4607 20 9.01172 19.6565 7.74467 19.0511L3 20L4.39499 16.28C3.51156 15.0423 3 13.5743 3 12C3 7.58172 7.02944 4 12 4C16.9706 4 21 7.58172 21 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                        <p class="fw-normal text-decoration-none text-center ms-0 mb-0" style="font-size: 13px;">Msg <span id="chatUnreadBadge" class="badge bg-danger" style="display:none;">0</span></p>
                    </a><a class="text-decoration-none d-flex flex-column align-items-center ms-3" href="#" onclick="debugNotificar(); return false;"><svg class="text-black" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" style="font-size: 24px;">
                            <path d="M12 8V12M12 16H12.01M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                        <p class="fw-normal text-decoration-none text-center text-danger ms-0 mb-0" style="font-size: 13px;">Notificar</p>
                    </a></h4>
            </div>
        </div>
    </section>
    <div class="border border-secondary ms-4 me-4 border-top opacity-25"></div>
    <nav class="navbar navbar-expand-md fixed-bottom bg-white ms-md-0 ps-md-0 mb-0 border-top">
        <div class="container-fluid">
            <div class="text-center d-flex w-100 justify-content-around ms-0 ps-0 me-0 mb-0 pb-0" id="dashboard-nav-root"></div>
        </div>
    </nav>
    <script src="assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/js/click%20button%20delay.js"></script>
    <script src="assets/js/dark-mode.js"></script>
    <script src="assets/js/notifications.js"></script>
    <script>
        let chatContextCache = null;

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        async function loadChatContext() {
            if (chatContextCache) return chatContextCache;
            const res = await fetch('/chat/context', { credentials: 'include' });
            if (!res.ok) throw new Error('No se pudo cargar informacion del chat');
            const data = await res.json();
            chatContextCache = data;

            const nombreEl = document.getElementById('terapeutaNombre');
            if (nombreEl && data && data.peer) {
                const baseName = `${data.peer.nombre || ''} ${data.peer.apellidos || ''}`.trim() || data.peer.correo || 'Fisioterapeuta';
                if (data.peer.rol === 'terapeuta') {
                    nombreEl.innerHTML = `<span style="color:#ffce2e;font-weight:700;">[TERAPEUTA]</span> ${escapeHtml(baseName)}`;
                } else {
                    nombreEl.textContent = baseName;
                }
            }
            return data;
        }

        async function abrirChat() {
            try {
                await loadChatContext();
                window.location.href = 'chat.html';
            } catch (e) {
                alert(e.message || 'No se pudo abrir el chat');
            }
        }

        async function debugNotificar() {
            try {
                const ctx = await loadChatContext();
                const basePeerName = `${ctx.peer?.nombre || ''} ${ctx.peer?.apellidos || ''}`.trim() || ctx.peer?.correo || 'fisioterapeuta';
                const peerName = ctx.peer?.rol === 'terapeuta' ? `[TERAPEUTA] ${basePeerName}` : basePeerName;
                notify({
                    title: 'Debug',
                    body: `Boton temporal. Chat con ${peerName} listo para pruebas.`,
                    playSound: false,
                    browserNotification: false
                });
            } catch (e) {
                alert(e.message || 'Error en debug');
            }
        }

        async function registerPushWorker() {
            try {
                await notifyRequestPermission();
                if (Notification.permission !== 'granted') {
                    await updatePushStatus();
                    return;
                }
                await pushRegister();
                await updatePushStatus();
                notify({
                    title: 'Notificaciones activadas',
                    body: 'Ya recibiras recordatorios en este dispositivo.',
                    playSound: false
                });
            } catch (error) {
                console.error('Error registering push worker:', error);
                await updatePushStatus();
                alert((error && error.message) || 'No se pudo activar notificaciones push');
            }
        }

        async function updateChatUnreadBadge() {
            const badge = document.getElementById('chatUnreadBadge');
            if (!badge) return;
            try {
                const res = await fetch('/chat/unread_count', { credentials: 'include' });
                if (!res.ok) return;
                const data = await res.json();
                const total = Number(data.total || 0);
                if (total > 0) {
                    badge.textContent = String(total > 99 ? '99+' : total);
                    badge.style.display = 'inline-block';
                } else {
                    badge.style.display = 'none';
                }
            } catch (e) {}
        }

        async function updatePushStatus() {
            const statusEl = document.getElementById('pushStatus');
            if (!statusEl || !('serviceWorker' in navigator) || !('PushManager' in window)) {
                return;
            }

            try {
                const registration = await navigator.serviceWorker.getRegistration();
                const subscription = registration ? await registration.pushManager.getSubscription() : null;
                const permission = Notification.permission;

                statusEl.className = 'alert py-2 mb-3';
                const enableBtn = document.getElementById('enablePushBtn');
                if (permission === 'granted' && subscription) {
                    statusEl.classList.add('alert-success');
                    statusEl.textContent = 'Notificaciones activas: recibirás recordatorios en tu navegador.';
                    if (enableBtn) {
                        enableBtn.textContent = 'Notificaciones activadas';
                        enableBtn.disabled = true;
                    }
                } else if (permission === 'denied') {
                    statusEl.classList.add('alert-danger');
                    statusEl.textContent = 'Notificaciones bloqueadas. Activa notificaciones en el navegador para recibir recordatorios.';
                    if (enableBtn) {
                        enableBtn.textContent = 'Notificaciones bloqueadas';
                        enableBtn.disabled = true;
                    }
                } else {
                    statusEl.classList.add('alert-secondary');
                    statusEl.textContent = 'Notificaciones no activadas. Permite notificaciones para recibir recordatorios push.';
                    if (enableBtn) {
                        enableBtn.textContent = 'Activar notificaciones';
                        enableBtn.disabled = false;
                    }
                }
                statusEl.classList.remove('d-none');
            } catch (error) {
                console.error('Error updating push status:', error);
            }
        }

        async function checkSurveyStatus() {
            const btn = document.getElementById('surveyBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status"></span>Cargando...';

            try {
                const response = await fetch('/encuesta/estado');
                const data = await response.json();

                if (data.racha !== undefined) {
                    document.getElementById('streakCount').textContent = data.racha;
                }

                if (data.completada) {
                    btn.classList.remove('btn-success');
                    btn.classList.add('btn-secondary');
                    btn.innerHTML = '<i class="material-icons me-2" style="vertical-align: middle;">check_circle</i>Evaluación Completada';
                    alert('¡Ya completaste tu evaluación diaria hoy! Gracias por tu participación.');
                } else {
                    window.location.href = 'formulario.html';
                }
            } catch (error) {
                console.error('Error checking survey status:', error);
                alert('Error al verificar el estado de la evaluación. Inténtalo de nuevo.');
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        // Check survey status on page load
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const enableBtn = document.getElementById('enablePushBtn');
                if (enableBtn) {
                    enableBtn.addEventListener('click', registerPushWorker);
                }

                const response = await fetch('/encuesta/estado');
                const data = await response.json();

                if (data.racha !== undefined) {
                    const streakElement = document.getElementById('streakCount');
                    if (streakElement) {
                        streakElement.textContent = data.racha;
                    }
                }

                const notice = document.getElementById('surveyNotice');
                        if (!data.completada && notice) {
                    notice.textContent = 'Aún no has completado tu encuesta diaria. Hazlo ahora para que tu fisioterapeuta pueda revisar tu progreso.';
                    notice.classList.remove('d-none');
                }

                if (data.completada) {
                    const btn = document.getElementById('surveyBtn');
                    btn.classList.remove('btn-success');
                    btn.classList.add('btn-secondary');
                    btn.innerHTML = '<i class="material-icons me-2" style="vertical-align: middle;">check_circle</i>Evaluación Completada';
                    btn.onclick = () => alert('¡Ya completaste tu evaluación diaria hoy! Gracias por tu participación.');
                }

                await loadChatContext();

                // If user already granted permission earlier, silently ensure subscription exists.
                if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
                    try {
                        await pushRegister();
                    } catch (e) {
                        console.error('Auto push re-subscribe failed:', e);
                    }
                }

                await updatePushStatus();
                await updateChatUnreadBadge();
                setInterval(updateChatUnreadBadge, 5000);
            } catch (error) {
                console.error('Error checking survey status on load:', error);
            }
        });
    </script>
</body>

</html>
