<!DOCTYPE html>
<html data-bs-theme="light" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Registro de Terapeuta - Fisioterapp</title>

    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/Fading%20animation.css">
    <link rel="stylesheet" href="assets/css/styles.min.css">
</head>

<body>

<section class="text-center screen" id="terapeuta-signup">

    <h4 class="mt-3 mb-0">Registro de Terapeuta</h4>

    <div class="container" style="font-size: 19px; max-width:400px;">

        <!-- FORM -->
        <form onsubmit="event.preventDefault(); registrarTerapeuta();">

            <p class="mt-4 mb-0 text-center">
                Información Personal
            </p>

            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input id="nombre" type="text" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="apellidos" class="form-label">Apellidos</label>
                <input id="apellidos" type="text" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono</label>
                <input id="telefono" type="tel" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="especialidad" class="form-label">Especialidad</label>
                <input id="especialidad" type="text" class="form-control" placeholder="Ej: Fisioterapia Deportiva, Ortopedia, etc." required>
            </div>

            <p class="mt-4 mb-0 text-center">
                Información de Cuenta
            </p>

            <div class="mb-3">
                <label for="correo" class="form-label">Correo electrónico</label>
                <input id="correo" type="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input id="password" type="password" class="form-control" required>
            </div>

            <div class="mb-4">
                <label for="confirmar" class="form-label">Confirmar contraseña</label>
                <input id="confirmar" type="password" class="form-control" required>
            </div>

            <button class="btn btn-primary w-100 mb-3" type="submit">
                Crear cuenta de Terapeuta
            </button>

            <div class="alert alert-info">
                <small>Después del registro recibirás un código único para compartir con tus pacientes.</small>
            </div>

            <div class="text-center">
                <a href="index-sign_up_paciente.html" class="text-decoration-none">¿Eres paciente? Regístrate aquí</a>
            </div>

        </form>

    </div>

</section>

<script src="assets/bootstrap/js/bootstrap.min.js"></script>

<script>
// Redirección automática si hay sesión activa
async function checkActiveSession() {
    try {
        const res = await fetch("/me", {
            method: "GET",
            credentials: "include"
        });
        
        if (res.ok) {
            const userData = await res.json();
            const rol = userData.rol;
            
            // Si hay sesión activa, redirigir al dashboard correspondiente
            if (rol === "paciente") {
                window.location.href = "dashboard-paciente-home.html";
            } else if (rol === "terapeuta") {
                window.location.href = "dashboard-terapeuta-home.html";
            } else if (rol === "admin") {
                window.location.href = "dashboard-admin.html";
            }
        }
    } catch (error) {
        console.log("No hay sesión activa");
    }
}

// Verificar sesión al cargar la página
document.addEventListener("DOMContentLoaded", checkActiveSession);

async function registrarTerapeuta() {
    const correo = document.getElementById("correo").value;
    const password = document.getElementById("password").value;
    const confirmar = document.getElementById("confirmar").value;
    const nombre = document.getElementById("nombre").value;
    const apellidos = document.getElementById("apellidos").value;
    const telefono = document.getElementById("telefono").value;
    const especialidad = document.getElementById("especialidad").value;

    // Validación básica
    if (password !== confirmar) {
        alert("Las contraseñas no coinciden");
        return;
    }

    const res = await fetch("/register", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        credentials: "include",
        body: JSON.stringify({
            correo,
            password,
            rol: "terapeuta",
            nombre,
            apellidos,
            telefono,
            especialidad
        })
    });

    const data = await res.json();

    if (data.success) {
        let mensaje = "Cuenta de terapeuta creada correctamente";
        if (data.codigo) {
            mensaje += `\n\nTu código de terapeuta es: ${data.codigo}\n\nComparte este código con tus pacientes para que puedan registrarse.`;
        }
        alert(mensaje);
        window.location.href = "index-sign_in.html";
    } else {
        alert(data.mensaje || "Error al registrar terapeuta");
    }
}
</script>

</body>
</html>
