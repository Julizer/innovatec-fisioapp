<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <script>
        (function() {
            const stored = localStorage.getItem('darkMode');
            const theme = stored === 'dark' || stored === 'light'
                ? stored
                : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.dataset.bsTheme = theme;
            if (theme === 'dark') document.documentElement.classList.add('dark-mode');
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Pruebas</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/fonts/material-icons.min.css">
    <link rel="stylesheet" href="assets/css/bss-overrides.css">
    <link rel="stylesheet" href="assets/css/Fading%20animation.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
</head>

<body>
    <section class="mt-3">
        <div class="d-flex justify-content-between align-items-center ms-2 me-3">
            <h1 class="mt-3 mb-0" style="font-size: 2.8rem; color: #0CBD97; font-weight: bold; font-family: 'Poppins', sans-serif;">¡Hola, <span id="terapeutaNombre">DOCTOR</span>!</h1>
        </div>
        <p class="ms-2 mt-4 pt-0 mb-0">Echa un vistazo a tu ultimo paciente:</p>
        <div class="card mb-3 mt-2">
            <div class="card-body">
                <h4 class="card-title">Paciente Rehabilitado</h4>
                <h6 class="text-muted mb-2 mt-2 card-subtitle">Diagnóstico:</h6>
                <p class="card-text">Paciente estable pero requiere más ejercicio físico para mejorar.</p>
                
            </div>
        </div>
    </section>
    <nav class="navbar navbar-expand-md fixed-bottom bg-white ms-md-0 ps-md-0 mb-0 border-top">
        <div class="container-fluid">
            <div class="text-center d-flex w-100 justify-content-around ms-0 ps-0 me-0 mb-0 pb-0" id="dashboard-nav-root"></div>
        </div>
    </nav>
    <script src="assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/js/click%20button%20delay.js"></script>
    <script src="assets/js/dark-mode.js"></script>
    <script src="assets/js/notifications.js"></script>
</body>

</html>
